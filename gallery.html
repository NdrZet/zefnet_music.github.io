<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - ZEFNET</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
</head>
<body>
    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <div id="background-placeholder"></div>
    <div id="header-placeholder"></div>

    <main>
        <section id="gallery-hero">
            <h1 class="md-typescale-display-large">Gallery</h1>
            <p class="md-typescale-body-large">A glimpse into the world of ZEFNET.</p>
        </section>

        <section id="full-gallery">
            <div class="gallery-grid">
                <div class="gallery-item"><img src="https://placehold.co/600x800/D0BCFF/121212?text=Live+1" alt="Gallery Image"></div>
                <div class="gallery-item"><img src="https://placehold.co/800x600/FF00BF/121212?text=Promo+1" alt="Gallery Image"></div>
                <div class="gallery-item"><img src="https://placehold.co/600x600/FFFFFF/121212?text=Studio" alt="Gallery Image"></div>
                <div class="gallery-item"><img src="https://placehold.co/800x600/1E1E1E/FFFFFF?text=Backstage" alt="Gallery Image"></div>
                <div class="gallery-item"><img src="https://placehold.co/600x800/4F378B/EADDFF?text=Live+2" alt="Gallery Image"></div>
                <div class="gallery-item"><img src="https://placehold.co/600x600/633B48/FFD8E4?text=Artwork" alt="Gallery Image"></div>
                <div class="gallery-item"><img src="https://placehold.co/800x600/121212/FFFFFF?text=On+The+Road" alt="Gallery Image"></div>
                <div class="gallery-item"><img src="https://placehold.co/600x800/B3B3B3/121212?text=Promo+2" alt="Gallery Image"></div>
            </div>
        </section>
    </main>

    <div id="lightbox">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>
</html>
