<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - ZEFNET</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
</head>
<body>
    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <div id="header-placeholder"></div>

    <main>
        <section id="contact-hero">
            <h1 class="md-typescale-display-large">Get in Touch</h1>
            <p class="md-typescale-body-large">For bookings, press, or just to say hello.</p>
        </section>

        <section id="contact-content">
            <div class="contact-form-container">
                <h2 class="md-typescale-headline-large">Send a Message</h2>
                <form class="contact-form">
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="md-button md-button--filled">Send</button>
                </form>
            </div>
            <div class="social-links-container">
                <h2 class="md-typescale-headline-large">Follow</h2>
                <ul class="social-links">
                    <li><a href="#">Spotify</a></li>
                    <li><a href="#">Apple Music</a></li>
                    <li><a href="#">YouTube</a></li>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">Bandcamp</a></li>
                </ul>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>
</html>
