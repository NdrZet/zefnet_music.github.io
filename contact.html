<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - ZEFNET</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <div id="header-placeholder"></div>

    <main class="contact-main">
        <div class="contact-split-layout">
            <div class="contact-left-panel">
                <!-- Atmospheric photo will be applied here via CSS -->
            </div>
            <div class="contact-right-panel">
                <div class="aurora-background">
                    <div class="aurora-layer" style="--aurora-color: var(--color-primary);"></div>
                    <div class="aurora-layer" style="--aurora-color: var(--color-accent);"></div>
                    <div class="aurora-layer" style="--aurora-color: #00aaff;"></div>
                </div>
                <div class="contact-content-wrapper">
                    <section id="contact-hero">
                        <h1 class="md-typescale-display-large">Follow ZEFNET</h1>
                        <p class="md-typescale-body-large">Find me on your favorite platform.</p>
                    </section>

                    <section id="contact-content">
                        <div class="social-grid-container">
                            <div class="social-grid">
                                <a href="#" class="social-button spotify">
                                    <i class="fab fa-spotify"></i>
                                    <span class="social-label">Spotify</span>
                                </a>
                                <a href="#" class="social-button apple">
                                    <i class="fab fa-apple"></i>
                                    <span class="social-label">Apple Music</span>
                                </a>
                                <a href="#" class="social-button youtube">
                                    <i class="fab fa-youtube"></i>
                                    <span class="social-label">YouTube</span>
                                </a>
                                <a href="#" class="social-button instagram">
                                    <i class="fab fa-instagram"></i>
                                    <span class="social-label">Instagram</span>
                                </a>
                                <a href="#" class="social-button bandcamp">
                                    <i class="fab fa-bandcamp"></i>
                                    <span class="social-label">Bandcamp</span>
                                </a>
                                <a href="#" class="social-button soundcloud">
                                    <i class="fab fa-soundcloud"></i>
                                    <span class="social-label">SoundCloud</span>
                                </a>
                            </div>
                        </div>
                         <div class="professional-contacts">
                            <p class="md-typescale-body-large">For booking & press inquiries:</p>
                            <a href="mailto:contact@zefnetmusic.com" class="md-typescale-title-large">contact@zefnetmusic.com</a>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>
</html>
